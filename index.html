<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.T. Painter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

        :root {
            --bg-color: #fcfbf9; /* Soft, warm off-white, like aged canvas */
            --text-main: #2c3e50; /* Deep blue-grey, avoiding harsh black */
            --accent: #8ba88e; /* Soft sage green */
            --accent-light: #d1d8ce;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, .serif-text {
            font-family: 'Playfair Display', serif;
        }

        .cursive-brand {
            font-family: 'Alex Brush', cursive;
            font-size: 2.5rem;
            line-height: 1;
        }

        /* Scroll Animation Classes */
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
            will-change: opacity, visibility;
        }

        .fade-in-section.is-visible {
            opacity: 1;
            transform: none;
            visibility: visible;
        }

        /* Impressionist details */
        .brush-stroke-divider {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            opacity: 0.5;
            margin: 2rem auto;
            width: 50%;
            border-radius: 50%;
        }

        .gallery-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
        }

        .gallery-image-container:hover {
            transform: translateY(-5px);
        }

        .gallery-image-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 1.5s ease;
        }

        .gallery-image-container:hover img {
            transform: scale(1.03); /* Subtle zoom on hover */
        }
        
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(252, 251, 249, 0.95), transparent);
            padding: 2rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
        }
        
        .gallery-image-container:hover .image-overlay {
            transform: translateY(0);
        }

        /* Hero Section Styling */
        #hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-light);
            /* A soft, blurred background to mimic an impressionist sky */
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 80%),
                              linear-gradient(135deg, #e0e8e4 0%, #c5d3c8 100%);
            overflow: hidden;
        }

        /* Soft blurred shapes in hero */
        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: 0;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #a8c0af; animation: float 20s infinite ease-in-out; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #d9e2d5; animation: float 25s infinite ease-in-out reverse; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            background: rgba(252, 251, 249, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        /* Modal for full size images */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 50;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem 1rem;
        }
        
        #imageModal.active {
            display: flex;
            opacity: 1;
        }
        
        #modalImg {
            max-width: 100%;
            max-height: 70vh;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 10px solid white;
            object-fit: contain;
        }
        
        .close-modal {
            position: absolute;
            top: 1rem;
            right: 2rem;
            font-size: 2.5rem;
            cursor: pointer;
            color: var(--text-main);
            transition: color 0.2s;
            z-index: 60;
        }
        .close-modal:hover { color: var(--accent); }

    </style>
</head>
<body class="antialiased selection:bg-[#8ba88e] selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 top-0 transition-all duration-300" id="navbar">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="cursive-brand tracking-wider font-bold">K.T. Painter</a>
            <div class="space-x-8 text-sm uppercase tracking-widest hidden md:block">
                <a href="#gallery" class="hover:text-[#8ba88e] transition-colors">Gallery</a>
                <a href="#about" class="hover:text-[#8ba88e] transition-colors">Artist</a>
                <a href="#contact" class="hover:text-[#8ba88e] transition-colors">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero">
        <div class="hero-blob blob-1"></div>
        <div class="hero-blob blob-2"></div>
        
        <div class="hero-content fade-in-section max-w-2xl mx-4">
            <p id="hero-subtitle" class="text-sm uppercase tracking-[0.3em] mb-4 text-[#8ba88e]"></p>
            <h1 id="hero-title" class="text-5xl md:text-7xl mb-6 leading-tight italic"></h1>
            <p id="hero-desc" class="text-lg font-light max-w-md mx-auto mb-8"></p>
            <a href="#gallery" class="inline-block border border-[#2c3e50] px-8 py-3 uppercase tracking-widest text-sm hover:bg-[#2c3e50] hover:text-[#fcfbf9] transition-colors duration-300">Enter Gallery</a>
        </div>
        
        <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce opacity-50">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </div>
    </header>

    <!-- Artist Writeup Section -->
    <section id="about" class="py-32 px-6 max-w-4xl mx-auto">
        <!-- Content is dynamically loaded from SITE_CONFIG below -->
        <div id="about-container" class="fade-in-section text-center"></div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="py-24 px-6 bg-[#f7f5f0]">
        <div class="max-w-7xl mx-auto">
            <div class="fade-in-section text-center mb-16">
                <h2 class="text-4xl italic">Selected Works</h2>
                <div class="brush-stroke-divider"></div>
            </div>

            <!-- Masonry-style Grid (CSS Columns) -->
            <!-- Gallery images are dynamically loaded from ARTWORK_PORTFOLIO below -->
            <div id="gallery-grid" class="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8"></div>
        </div>
    </section>

    <!-- Contact / Footer -->
    <footer id="contact" class="py-24 px-6 border-t border-gray-200 text-center">
        <div class="fade-in-section">
            <h2 id="contact-title" class="text-3xl mb-6 italic"></h2>
            <p id="contact-desc" class="mb-8 font-light max-w-md mx-auto"></p>
            <a id="contact-email" href="#" class="inline-block border-b border-[#2c3e50] pb-1 uppercase tracking-widest text-sm hover:text-[#8ba88e] hover:border-[#8ba88e] transition-colors"></a>
            
            <div class="mt-16 flex justify-center space-x-6 text-sm text-gray-400">
                <a href="#" class="hover:text-gray-600 transition-colors">Instagram</a>
                <a href="#" class="hover:text-gray-600 transition-colors">Artsy</a>
            </div>
            <p class="mt-8 text-xs text-gray-400">&copy; <span id="year"></span> K.T. Painter. All rights reserved.</p>
        </div>
    </footer>

    <!-- Fullscreen Image Modal with Details -->
    <div id="imageModal">
        <span class="close-modal" onclick="closeModal()" title="Close">&times;</span>
        <div class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center min-h-full py-12">
            <img id="modalImg" src="" alt="Full size painting">
            <div class="mt-8 w-full max-w-2xl bg-white/60 p-8 rounded-sm shadow-sm backdrop-blur-md text-center">
                <h3 id="modalTitle" class="serif-text text-3xl italic text-[#2c3e50] mb-2"></h3>
                <p id="modalSpecs" class="text-xs uppercase tracking-widest text-[#8ba88e] font-bold mb-4"></p>
                <div class="brush-stroke-divider w-1/4 my-4 mx-auto"></div>
                <p id="modalDesc" class="font-light text-gray-700 leading-relaxed text-sm"></p>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // 📝 SITE CONFIGURATION 📝
        // Edit your website text here. This section updates the Hero, About, and Contact areas.
        // =====================================================================
        const SITE_CONFIG = {
            hero: {
                subtitle: "Landscapes in Light",
                title: "Capturing the <br>Fleeting Moment",
                desc: "An exploration of nature through color, light, and impression."
            },
            about: {
                title: "The Philosophy of Sight",
                paragraphs: "My work is not about painting the landscape exactly as it is, but rather painting the light that falls upon it. I seek to capture those transient moments—the sudden break of dawn over a misty field, the heavy, gilded light of late afternoon, or the cool, melancholic blues of twilight.\n\nWorking primarily en plein air, I use rapid brushstrokes and broken color to translate the immediate visual sensation onto canvas. The details are less important than the overall atmosphere; it is the feeling of the place, the temperature of the air, that I wish to convey to the observer.",
                quote: "\"We do not see nature with our eyes, but with our understandings and our hearts.\""
            },
            contact: {
                title: "Inquiries",
                desc: "For commissions, studio visits, or pricing details, please reach out.",
                email: "studio@ktpainting.com"
            }
        };

        // =====================================================================
        // 🎨 ARTWORK DATA SECTION 🎨
        // Add your paintings to this list. 
        // IMPORTANT: Change the imagePath to point to the actual files in your 'images' folder.
        // Example: imagePath: "images/painting-01.jpg"
        // =====================================================================
        const ARTWORK_PORTFOLIO = [
            {
                imagePath: "images/Lion.jpeg"
                title: "Sunrise over the Valley",
                year: "2024",
                medium: "Oil on Canvas",
                dimensions: "16x20\"",
                description: "Captured during the early hours of dawn, focusing on the interplay of cool morning mist and warm sunlight across the dew-covered grass."
            },
            {
                imagePath: "https://placehold.co/1000x800/d1d8ce/2c3e50?text=The+Gilded+Afternoon", // <-- CHANGE THIS TO YOUR LOCAL FILE
                title: "The Gilded Afternoon",
                year: "2023",
                medium: "Oil on Board",
                dimensions: "12x16\"",
                description: "An exploration of heavy, late-afternoon light reflecting off a quiet, slow-moving stream in the height of summer."
            },
            {
                imagePath: "https://placehold.co/900x1200/c5d3c8/2c3e50?text=Melancholy+Twilight", // <-- CHANGE THIS TO YOUR LOCAL FILE
                title: "Melancholy Twilight",
                year: "2023",
                medium: "Watercolor on Paper",
                dimensions: "18x24\"",
                description: "The fleeting transition between day and night, characterized by cool, melancholic blues and violent strokes of shadow."
            }
        ];
        
        // --- Core Rendering Function ---
        function renderContent() {
            // Render Hero Section
            document.getElementById('hero-subtitle').textContent = SITE_CONFIG.hero.subtitle;
            document.getElementById('hero-title').innerHTML = SITE_CONFIG.hero.title;
            document.getElementById('hero-desc').textContent = SITE_CONFIG.hero.desc;

            // Render About Section
            const aboutContainer = document.getElementById('about-container');
            let aboutHtml = `<h2 class="text-4xl mb-8 italic">${SITE_CONFIG.about.title}</h2>
                             <div class="brush-stroke-divider"></div>
                             <div class="prose prose-lg mx-auto text-center font-light leading-relaxed space-y-6 mt-12 text-gray-700">`;
            
            const paras = SITE_CONFIG.about.paragraphs.split('\n');
            paras.forEach(p => {
                if (p.trim()) aboutHtml += `<p>${p}</p>`;
            });
            if (SITE_CONFIG.about.quote) {
                aboutHtml += `<p class="serif-text text-2xl italic mt-12 text-[#8ba88e]">${SITE_CONFIG.about.quote}</p>`;
            }
            aboutHtml += `</div>`;
            aboutContainer.innerHTML = aboutHtml;

            // Render Contact Section
            document.getElementById('contact-title').textContent = SITE_CONFIG.contact.title;
            document.getElementById('contact-desc').textContent = SITE_CONFIG.contact.desc;
            const emailEl = document.getElementById('contact-email');
            emailEl.textContent = SITE_CONFIG.contact.email;
            emailEl.href = `mailto:${SITE_CONFIG.contact.email}`;

            // Render Gallery Section
            const galleryGrid = document.getElementById('gallery-grid');
            let galleryHtml = '';
            
            if (ARTWORK_PORTFOLIO.length === 0) {
                galleryHtml = `<div class="col-span-full text-center py-20 text-gray-400 italic text-lg">The gallery is currently empty. Please add artwork data to the code.</div>`;
            } else {
                ARTWORK_PORTFOLIO.forEach((item, index) => {
                    // Pass the index to the openModal function to retrieve full details later
                    galleryHtml += `
                    <div class="gallery-image-container fade-in-section break-inside-avoid relative group">
                        <img src="${item.imagePath}" alt="${item.title}" loading="lazy" class="cursor-pointer w-full" onclick="openModal(${index})">
                        <div class="image-overlay pointer-events-none">
                            <h3 class="text-xl mb-1 italic">${item.title}</h3>
                            <p class="text-xs uppercase tracking-widest text-gray-500">${item.medium}, ${item.year}</p>
                        </div>
                    </div>`;
                });
            }
            galleryGrid.innerHTML = galleryHtml;
            
            // Re-trigger intersection observer for newly added gallery items
            setTimeout(() => {
                document.querySelectorAll('.fade-in-section:not(.is-visible)').forEach((section) => {
                    observer.observe(section);
                });
            }, 100);
        }

        // Initialize content immediately
        renderContent();

        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Navbar scroll effect (shrinks and blurs background on scroll)
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('bg-[#fcfbf9]/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.remove('py-4');
                navbar.classList.add('py-2');
            } else {
                navbar.classList.remove('bg-[#fcfbf9]/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.remove('py-2');
                navbar.classList.add('py-4');
            }
        });

        // Intersection Observer for elegant fade-in animations on scroll
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, observerOptions);

        // Select and observe all elements with the fade-in class initially
        document.querySelectorAll('.fade-in-section').forEach((section) => {
            observer.observe(section);
        });

        // --- Detailed Image Modal Logic ---
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalSpecs = document.getElementById('modalSpecs');
        const modalDesc = document.getElementById('modalDesc');

        function openModal(artworkIndex) {
            const artwork = ARTWORK_PORTFOLIO[artworkIndex];
            
            // Populate Modal Data
            modalImg.src = artwork.imagePath;
            modalTitle.textContent = artwork.title;
            modalSpecs.textContent = `${artwork.medium} | ${artwork.dimensions} | ${artwork.year}`;
            modalDesc.textContent = artwork.description;
            
            // Show Modal
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = ''; // Restore background scrolling
            
            // Clear contents after transition finishes
            setTimeout(() => { 
                modalImg.src = ''; 
                modalTitle.textContent = '';
                modalSpecs.textContent = '';
                modalDesc.textContent = '';
            }, 300);
        }

        // Close modal when clicking the blurred background area
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Close modal when pressing the Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
