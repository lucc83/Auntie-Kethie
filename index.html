<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.T. Painting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

        :root {
            --bg-color: #fcfbf9; /* Soft, warm off-white, like aged canvas */
            --text-main: #2c3e50; /* Deep blue-grey, avoiding harsh black */
            --accent: #8ba88e; /* Soft sage green */
            --accent-light: #d1d8ce;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, .serif-text {
            font-family: 'Playfair Display', serif;
        }

        .cursive-brand {
            font-family: 'Alex Brush', cursive;
            font-size: 2.5rem;
            line-height: 1;
        }

        /* Scroll Animation Classes */
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
            will-change: opacity, visibility;
        }

        .fade-in-section.is-visible {
            opacity: 1;
            transform: none;
            visibility: visible;
        }

        /* Impressionist details */
        .brush-stroke-divider {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            opacity: 0.5;
            margin: 2rem auto;
            width: 50%;
            border-radius: 50%;
        }

        .gallery-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
        }

        .gallery-image-container:hover {
            transform: translateY(-5px);
        }

        .gallery-image-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 1.5s ease;
        }

        .gallery-image-container:hover img {
            transform: scale(1.03); /* Subtle zoom on hover */
        }
        
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(252, 251, 249, 0.95), transparent);
            padding: 2rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
        }
        
        .gallery-image-container:hover .image-overlay {
            transform: translateY(0);
        }

        /* Hero Section Styling */
        #hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-light);
            /* A soft, blurred background to mimic an impressionist sky */
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 80%),
                              linear-gradient(135deg, #e0e8e4 0%, #c5d3c8 100%);
            overflow: hidden;
        }

        /* Soft blurred shapes in hero */
        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: 0;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #a8c0af; animation: float 20s infinite ease-in-out; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #d9e2d5; animation: float 25s infinite ease-in-out reverse; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            background: rgba(252, 251, 249, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        /* Modal for full size images */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 50;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(252, 251, 249, 0.95);
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
            align-items: center;
            justify-content: center;
        }
        
        #imageModal.active {
            display: flex;
            opacity: 1;
        }
        
        #modalImg {
            max-width: 90%;
            max-height: 85vh;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 10px solid white;
        }
        
        .close-modal {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-main);
            transition: color 0.2s;
        }
        .close-modal:hover { color: var(--accent); }

    </style>
</head>
<body class="antialiased selection:bg-[#8ba88e] selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 top-0 transition-all duration-300" id="navbar">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="cursive-brand tracking-wider font-bold">K.T. Painting</a>
            <div class="space-x-8 text-sm uppercase tracking-widest hidden md:block">
                <a href="#gallery" class="hover:text-[#8ba88e] transition-colors">Gallery</a>
                <a href="#about" class="hover:text-[#8ba88e] transition-colors">Artist</a>
                <a href="#contact" class="hover:text-[#8ba88e] transition-colors">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero">
        <div class="hero-blob blob-1"></div>
        <div class="hero-blob blob-2"></div>
        
        <div class="hero-content fade-in-section max-w-2xl mx-4">
            <p id="hero-subtitle" class="text-sm uppercase tracking-[0.3em] mb-4 text-[#8ba88e]"></p>
            <h1 id="hero-title" class="text-5xl md:text-7xl mb-6 leading-tight italic"></h1>
            <p id="hero-desc" class="text-lg font-light max-w-md mx-auto mb-8"></p>
            <a href="#gallery" class="inline-block border border-[#2c3e50] px-8 py-3 uppercase tracking-widest text-sm hover:bg-[#2c3e50] hover:text-[#fcfbf9] transition-colors duration-300">Enter Gallery</a>
        </div>
        
        <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce opacity-50">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </div>
    </header>

    <!-- Artist Writeup Section -->
    <section id="about" class="py-32 px-6 max-w-4xl mx-auto">
        <!-- We've added an ID here so JavaScript can inject your content -->
        <div id="about-container" class="fade-in-section text-center">
            <!-- Content is now dynamically loaded from SITE_CONFIG in the script below -->
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="py-24 px-6 bg-[#f7f5f0]">
        <div class="max-w-7xl mx-auto">
            <div class="fade-in-section text-center mb-16">
                <h2 class="text-4xl italic">Selected Works</h2>
                <div class="brush-stroke-divider"></div>
            </div>

            <!-- Masonry-style Grid (CSS Columns) -->
            <!-- We've added an ID here so JavaScript can inject your images -->
            <div id="gallery-grid" class="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8">
                <!-- Gallery images are now dynamically loaded from SITE_CONFIG in the script below -->
            </div>
        </div>
    </section>

    <!-- Contact / Footer -->
    <footer id="contact" class="py-24 px-6 border-t border-gray-200 text-center">
        <div class="fade-in-section">
            <h2 id="contact-title" class="text-3xl mb-6 italic"></h2>
            <p id="contact-desc" class="mb-8 font-light max-w-md mx-auto"></p>
            <a id="contact-email" href="#" class="inline-block border-b border-[#2c3e50] pb-1 uppercase tracking-widest text-sm hover:text-[#8ba88e] hover:border-[#8ba88e] transition-colors"></a>
            
            <div class="mt-16 flex justify-center space-x-6 text-sm text-gray-400">
                <a href="#" class="hover:text-gray-600 transition-colors">Instagram</a>
                <a href="#" class="hover:text-gray-600 transition-colors">Artsy</a>
            </div>
            <p class="mt-8 text-xs text-gray-400">&copy; <span id="year"></span> K.T. Painting. All rights reserved.</p>
        </div>
    </footer>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="text-center">
            <img id="modalImg" src="" alt="Full size painting">
            <p id="modalCaption" class="mt-4 serif-text text-xl italic text-gray-800"></p>
        </div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="fixed bottom-8 right-8 z-40 flex flex-col space-y-4">
        <button onclick="promptPassword(openSettingsModal)" class="bg-[#2c3e50] text-white p-4 rounded-full shadow-lg hover:bg-[#1a252f] hover:scale-105 transition-all duration-300 group" title="Edit Site Content">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button onclick="promptPassword(triggerFileInput)" class="bg-[#8ba88e] text-white p-4 rounded-full shadow-lg hover:bg-[#6c876f] hover:scale-105 transition-all duration-300 group" title="Upload New Painting">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

    <!-- Password Modal -->
    <div id="passwordModal" class="fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-[#fcfbf9] w-full max-w-sm p-8 rounded-lg shadow-2xl mx-4 transform scale-95 transition-transform duration-300" id="passwordModalContent">
            <h3 class="text-2xl italic mb-4 text-center">Artist Access</h3>
            <p class="text-sm text-center text-gray-500 mb-6">Please enter your password to continue.</p>
            <input type="password" id="pwdInput" class="w-full border-b border-gray-300 bg-transparent px-2 py-2 mb-6 text-center focus:outline-none focus:border-[#8ba88e]" placeholder="Password">
            <div class="flex justify-center space-x-4">
                <button onclick="closePasswordModal()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-800 transition-colors">Cancel</button>
                <button onclick="submitPassword()" class="px-6 py-2 bg-[#2c3e50] text-white text-sm uppercase tracking-widest hover:bg-[#8ba88e] transition-colors rounded">Verify</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-[#fcfbf9] w-full max-w-2xl max-h-[90vh] overflow-y-auto p-8 rounded-lg shadow-2xl mx-4 transform scale-95 transition-transform duration-300" id="settingsModalContent">
            <h3 class="text-2xl italic mb-6 text-center">Edit Site Content</h3>
            
            <div class="space-y-6">
                <!-- Hero Settings -->
                <div class="border-b border-gray-200 pb-4">
                    <h4 class="text-lg font-bold mb-3 text-gray-700">Hero Section</h4>
                    <input type="text" id="setHeroSub" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Subtitle">
                    <input type="text" id="setHeroTitle" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Title (use <br> for new line)">
                    <textarea id="setHeroDesc" class="w-full border border-gray-300 p-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Description" rows="2"></textarea>
                </div>
                <!-- About Settings -->
                <div class="border-b border-gray-200 pb-4">
                    <h4 class="text-lg font-bold mb-3 text-gray-700">Artist Section</h4>
                    <input type="text" id="setAboutTitle" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Section Title">
                    <textarea id="setAboutParas" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Paragraphs (separate by double newlines)" rows="4"></textarea>
                    <input type="text" id="setAboutQuote" class="w-full border border-gray-300 p-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Quote (optional)">
                </div>
                <!-- Contact Settings -->
                <div>
                    <h4 class="text-lg font-bold mb-3 text-gray-700">Contact Section</h4>
                    <input type="text" id="setContactTitle" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Contact Title">
                    <textarea id="setContactDesc" class="w-full border border-gray-300 p-2 mb-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Contact Description" rows="2"></textarea>
                    <input type="text" id="setContactEmail" class="w-full border border-gray-300 p-2 bg-transparent rounded focus:outline-none focus:border-[#8ba88e]" placeholder="Email Address">
                </div>
            </div>

            <div class="mt-8 flex justify-end space-x-4">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-800 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-6 py-2 bg-[#2c3e50] text-white text-sm uppercase tracking-widest hover:bg-[#8ba88e] transition-colors rounded">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Upload Details Modal -->
    <div id="uploadModal" class="fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-[#fcfbf9] w-full max-w-md p-8 rounded-lg shadow-2xl mx-4 transform scale-95 transition-transform duration-300" id="uploadModalContent">
            <h3 class="text-2xl italic mb-6 text-center">New Masterpiece</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm uppercase tracking-widest text-gray-500 mb-1">Artwork Title</label>
                    <input type="text" id="uploadTitle" class="w-full border-b border-gray-300 bg-transparent px-2 py-2 focus:outline-none focus:border-[#8ba88e] transition-colors" placeholder="e.g. Sunrise over the Valley">
                </div>
                <div>
                    <label class="block text-sm uppercase tracking-widest text-gray-500 mb-1">Details</label>
                    <input type="text" id="uploadDetails" class="w-full border-b border-gray-300 bg-transparent px-2 py-2 focus:outline-none focus:border-[#8ba88e] transition-colors" placeholder="e.g. Oil on Canvas, 16x20&quot;">
                </div>
            </div>
            <div class="mt-8 flex justify-end space-x-4">
                <button onclick="closeUploadModal()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-800 transition-colors">Cancel</button>
                <button onclick="saveArtwork()" class="px-6 py-2 bg-[#2c3e50] text-white text-sm uppercase tracking-widest hover:bg-[#8ba88e] transition-colors rounded">Add to Gallery</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification (replaces alert) -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-white text-[#2c3e50] px-6 py-3 shadow-lg rounded-full opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4">
        <span id="toastMessage"></span>
    </div>

    <script>
        // =====================================================================
        // 🎨 DYNAMIC STATE MANAGEMENT
        // =====================================================================
        
        const DEFAULT_SITE_DATA = {
            hero: {
                subtitle: "Landscapes in Light",
                title: "Capturing the <br>Fleeting Moment",
                desc: "An exploration of nature through color, light, and impression."
            },
            about: {
                title: "The Philosophy of Sight",
                paragraphs: "My work is not about painting the landscape exactly as it is, but rather painting the light that falls upon it. I seek to capture those transient moments—the sudden break of dawn over a misty field, the heavy, gilded light of late afternoon, or the cool, melancholic blues of twilight.\n\nWorking primarily en plein air, I use rapid brushstrokes and broken color to translate the immediate visual sensation onto canvas. The details are less important than the overall atmosphere; it is the feeling of the place, the temperature of the air, that I wish to convey to the observer.",
                quote: "\"We do not see nature with our eyes, but with our understandings and our hearts.\""
            },
            contact: {
                title: "Inquiries",
                desc: "For commissions, studio visits, or pricing details, please reach out.",
                email: "studio@ktpainting.com"
            }
        };

        let pendingImageData = null;
        let pendingAction = null;
        
        // --- Data Fetching ---
        function getSiteData() {
            try {
                const stored = localStorage.getItem('ktPaintingSiteData');
                return stored ? JSON.parse(stored) : DEFAULT_SITE_DATA;
            } catch (e) {
                return DEFAULT_SITE_DATA;
            }
        }

        function saveSiteData(data) {
            localStorage.setItem('ktPaintingSiteData', JSON.stringify(data));
        }

        function getCustomGallery() {
            try {
                const stored = localStorage.getItem('ktPaintingGallery');
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error("Could not read from local storage", e);
                return [];
            }
        }

        // --- Authentication Flow ---
        function promptPassword(actionCallback) {
            pendingAction = actionCallback;
            const modal = document.getElementById('passwordModal');
            const content = document.getElementById('passwordModalContent');
            
            document.getElementById('pwdInput').value = '';
            
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            void modal.offsetWidth; 
            
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
            
            document.getElementById('pwdInput').focus();
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            const content = document.getElementById('passwordModalContent');
            
            modal.classList.remove('opacity-100');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = '';
                pendingAction = null;
            }, 300);
        }

        function submitPassword() {
            const pwd = document.getElementById('pwdInput').value;
            if (pwd === 'kethie') {
                closePasswordModal();
                if(pendingAction) pendingAction();
            } else {
                showToast("Incorrect password.");
            }
        }

        // Handle Enter key for password
        document.getElementById('pwdInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitPassword();
        });

        // --- Settings Management ---
        function openSettingsModal() {
            const data = getSiteData();
            
            document.getElementById('setHeroSub').value = data.hero.subtitle;
            document.getElementById('setHeroTitle').value = data.hero.title;
            document.getElementById('setHeroDesc').value = data.hero.desc;
            
            document.getElementById('setAboutTitle').value = data.about.title;
            document.getElementById('setAboutParas').value = data.about.paragraphs;
            document.getElementById('setAboutQuote').value = data.about.quote;
            
            document.getElementById('setContactTitle').value = data.contact.title;
            document.getElementById('setContactDesc').value = data.contact.desc;
            document.getElementById('setContactEmail').value = data.contact.email;

            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            void modal.offsetWidth; 
            
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            
            modal.classList.remove('opacity-100');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = '';
            }, 300);
        }

        function saveSettings() {
            const newData = {
                hero: {
                    subtitle: document.getElementById('setHeroSub').value,
                    title: document.getElementById('setHeroTitle').value,
                    desc: document.getElementById('setHeroDesc').value
                },
                about: {
                    title: document.getElementById('setAboutTitle').value,
                    paragraphs: document.getElementById('setAboutParas').value,
                    quote: document.getElementById('setAboutQuote').value
                },
                contact: {
                    title: document.getElementById('setContactTitle').value,
                    desc: document.getElementById('setContactDesc').value,
                    email: document.getElementById('setContactEmail').value
                }
            };
            
            saveSiteData(newData);
            closeSettingsModal();
            renderContent();
            showToast("Settings saved successfully!");
        }

        // --- Core Rendering ---
        function renderContent() {
            const siteData = getSiteData();

            // Hero
            document.getElementById('hero-subtitle').textContent = siteData.hero.subtitle;
            document.getElementById('hero-title').innerHTML = siteData.hero.title;
            document.getElementById('hero-desc').textContent = siteData.hero.desc;

            // About
            const aboutContainer = document.getElementById('about-container');
            let aboutHtml = `<h2 class="text-4xl mb-8 italic">${siteData.about.title}</h2><div class="brush-stroke-divider"></div><div class="prose prose-lg mx-auto text-center font-light leading-relaxed space-y-6 mt-12 text-gray-700">`;
            const paras = siteData.about.paragraphs.split('\n');
            paras.forEach(p => {
                if (p.trim()) aboutHtml += `<p>${p}</p>`;
            });
            if (siteData.about.quote) aboutHtml += `<p class="serif-text text-2xl italic mt-12 text-[#8ba88e]">${siteData.about.quote}</p>`;
            aboutHtml += `</div>`;
            aboutContainer.innerHTML = aboutHtml;

            // Contact
            document.getElementById('contact-title').textContent = siteData.contact.title;
            document.getElementById('contact-desc').textContent = siteData.contact.desc;
            const emailEl = document.getElementById('contact-email');
            emailEl.textContent = siteData.contact.email;
            emailEl.href = `mailto:${siteData.contact.email}`;

            // Gallery
            const gallery = getCustomGallery();
            const galleryGrid = document.getElementById('gallery-grid');
            let galleryHtml = '';
            
            if (gallery.length === 0) {
                galleryHtml = `<div class="col-span-full text-center py-20 text-gray-400 italic text-lg">The gallery is currently empty. Click the plus button to add your first painting.</div>`;
            } else {
                gallery.forEach((item, index) => {
                    const escapedImg = item.imageSrc.replace(/'/g, "\\'");
                    const escapedTitle = item.title.replace(/'/g, "\\'");
                    
                    galleryHtml += `
                    <div class="gallery-image-container fade-in-section break-inside-avoid relative group">
                        <!-- Delete Button (requires password) -->
                        <div class="absolute top-4 right-4 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); promptPassword(() => deleteImage(${index}))" class="bg-white/90 text-red-500 p-2 rounded-full shadow-md hover:bg-red-50 hover:text-red-600 transition-colors" title="Remove Painting">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
                            </button>
                        </div>
                        
                        <img src="${item.imageSrc}" alt="${item.title}" loading="lazy" class="cursor-pointer w-full" onclick="openModal('${escapedImg}', '${escapedTitle}')">
                        <div class="image-overlay pointer-events-none">
                            <h3 class="text-xl mb-1 italic">${item.title}</h3>
                            <p class="text-xs uppercase tracking-widest text-gray-500">${item.details}</p>
                        </div>
                    </div>`;
                });
            }
            galleryGrid.innerHTML = galleryHtml;
            
            setTimeout(() => {
                document.querySelectorAll('.fade-in-section:not(.is-visible)').forEach((section) => {
                    observer.observe(section);
                });
            }, 100);
        }

        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        function deleteImage(index) {
            try {
                const gallery = getCustomGallery();
                gallery.splice(index, 1);
                localStorage.setItem('ktPaintingGallery', JSON.stringify(gallery));
                renderContent();
                showToast("Painting removed successfully.");
            } catch (e) {
                console.error(e);
                showToast("Error removing painting.");
            }
        }

        // Initialize content immediately
        renderContent();

        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Navbar scroll effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('bg-[#fcfbf9]/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.remove('py-4');
                navbar.classList.add('py-2');
            } else {
                navbar.classList.remove('bg-[#fcfbf9]/90', 'backdrop-blur-md', 'shadow-sm');
                navbar.classList.remove('py-2');
                navbar.classList.add('py-4');
            }
        });

        // Intersection Observer for fade-in animations
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, observerOptions);

        // Select all elements with the fade-in class
        document.querySelectorAll('.fade-in-section').forEach((section) => {
            observer.observe(section);
        });

        // Modal Logic
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');

        function openModal(imgSrc, caption) {
            modalImg.src = imgSrc;
            modalCaption.textContent = caption;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => { modalImg.src = ''; }, 300);
            document.body.style.overflow = ''; 
        }

        // Close modals dynamically
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modal.classList.contains('active')) closeModal();
                if (!document.getElementById('uploadModal').classList.contains('hidden')) closeUploadModal();
                if (!document.getElementById('passwordModal').classList.contains('hidden')) closePasswordModal();
                if (!document.getElementById('settingsModal').classList.contains('hidden')) closeSettingsModal();
            }
        });

        // --- Upload Feature Logic ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast("Please select an image file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    pendingImageData = canvas.toDataURL('image/jpeg', 0.85); 
                    openUploadModal();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function openUploadModal() {
            const uploadModal = document.getElementById('uploadModal');
            const uploadContent = document.getElementById('uploadModalContent');
            
            document.getElementById('uploadTitle').value = '';
            document.getElementById('uploadDetails').value = '';
            
            uploadModal.classList.remove('hidden');
            uploadModal.style.display = 'flex';
            
            void uploadModal.offsetWidth; 
            
            uploadModal.classList.add('opacity-100');
            uploadContent.classList.remove('scale-95');
            uploadContent.classList.add('scale-100');
            
            document.getElementById('uploadTitle').focus();
        }

        function closeUploadModal() {
            const uploadModal = document.getElementById('uploadModal');
            const uploadContent = document.getElementById('uploadModalContent');
            
            uploadModal.classList.remove('opacity-100');
            uploadContent.classList.remove('scale-100');
            uploadContent.classList.add('scale-95');
            
            setTimeout(() => {
                uploadModal.classList.add('hidden');
                uploadModal.style.display = '';
                pendingImageData = null;
            }, 300);
        }

        function saveArtwork() {
            const title = document.getElementById('uploadTitle').value.trim() || 'Untitled';
            const details = document.getElementById('uploadDetails').value.trim() || 'Details unavailable';
            
            if (!pendingImageData) {
                showToast("Image data lost. Please try again.");
                closeUploadModal();
                return;
            }

            const newArtwork = {
                imageSrc: pendingImageData,
                title: title,
                details: details
            };

            try {
                const customGallery = getCustomGallery();
                customGallery.unshift(newArtwork); 
                localStorage.setItem('ktPaintingGallery', JSON.stringify(customGallery));
                
                closeUploadModal();
                renderContent(); 
                showToast("Masterpiece added successfully!");
                
                document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
                
            } catch (e) {
                console.error(e);
                showToast("Storage full! Please clear browser data to add more.");
                closeUploadModal();
            }
        }
    </script>
</body>
</html>
